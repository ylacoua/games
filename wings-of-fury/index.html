<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כנפי הרעם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen canvas cockpit; menus are "squadron ready-room" boards laid over it */
:root{
  --navy:#0e1a2b; --navy2:#16263d; --steel:#8fa3b8; --paper:#efe6cf; --ink:#1b1a16;
  --signal:#e8b33a; --red:#c8402f; --ok:#5fae6b;
  --display:"Secular One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--navy);color:var(--paper);font-family:var(--body);overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--navy)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,14,24,.78);direction:rtl;overflow-y:auto;z-index:5}
.board{width:min(980px,100%);max-height:100%;overflow-y:auto;background:var(--navy2);border:2px solid #2c4262;
  border-radius:6px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,7vw,64px);color:var(--signal);letter-spacing:.02em;line-height:1}
h2{font-size:26px;color:var(--signal)}
h3{font-size:18px;color:var(--paper)}
.sub{color:var(--steel);font-size:15px;margin:6px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:#0f1d30;border:1px solid #2c4262;border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.sel{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.card.locked{opacity:.55}
.card p{margin:0;color:var(--steel);font-size:13px;line-height:1.45}
.stats{font-size:12px;color:var(--steel);font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.bar{height:6px;background:#22344d;border-radius:3px;overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--signal)}
button{font-family:var(--body);font-size:15px;font-weight:500;cursor:pointer;border-radius:4px;border:1px solid #3b5679;
  background:#1d3150;color:var(--paper);padding:8px 14px}
button:hover{background:#27406a}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button.primary{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button.on{background:var(--paper);color:var(--ink)}
.money{font-family:var(--display);font-size:22px;color:var(--signal);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.lvl{text-align:right;display:flex;flex-direction:column;gap:3px;padding:10px}
.lvl small{color:var(--steel);font-size:12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;color:var(--steel)}
.keys span b.mv{all:unset;color:var(--signal);font-weight:700}
.keys b{color:var(--paper);font-family:monospace;font-size:13px;background:#0b1626;border:1px solid #2c4262;border-radius:3px;padding:1px 6px;text-align:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:#22344d;color:var(--steel)}
.pill.boss{background:var(--red);color:#fff}
.note{font-size:13px;color:var(--steel)}
#touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:4;pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;pointer-events:auto}
#touch button{background:rgba(20,35,58,.55);border-color:rgba(143,163,184,.5);padding:0;font-size:20px;touch-action:none}
@media (pointer:coarse){#touch{display:flex}}
#title{position:fixed;inset:0;z-index:10;background:#05090f;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
#title .blur{position:absolute;inset:-40px;background:url("img/title.jpg") center/cover;filter:blur(24px) brightness(.45)}
#title img{position:relative;max-width:100%;max-height:100%;object-fit:contain;display:block}
#title .press{position:absolute;left:0;right:0;bottom:calc(6% + env(safe-area-inset-bottom,0px));text-align:center;direction:rtl;
  font-family:var(--display);font-size:clamp(20px,3.6vw,38px);color:#fff4d6;letter-spacing:.02em;
  text-shadow:0 0 6px #000,0 2px 0 #7a1f12,0 0 18px rgba(232,179,58,.7);animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
#title .credits{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));direction:rtl;display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-family:var(--body);font-size:clamp(12px,1.4vw,15px);color:rgba(255,244,214,.85);text-shadow:0 1px 3px #000}
#title .credits b{font-family:var(--display);font-weight:400;letter-spacing:.06em;color:var(--signal)}
#musicBtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;background:rgba(8,14,24,.7);border-color:rgba(232,179,58,.6);color:var(--signal);font-size:14px}
/* Home screen: the canvas sunset with flying planes shows through; side menu on the right, its panel beside it */
.home{position:fixed;inset:0;z-index:5;direction:rtl;display:grid;grid-template-columns:minmax(230px,280px) minmax(0,620px) 1fr;
  grid-template-rows:auto minmax(0,1fr);gap:14px 22px;padding:clamp(14px,3vh,30px) clamp(16px,3vw,40px) 20px;
  background:linear-gradient(to left,rgba(8,14,24,.82),rgba(8,14,24,.45) 55%,rgba(8,14,24,.15));overflow:hidden}
.home-title{grid-column:1/-1;text-align:center;text-shadow:0 3px 0 #5a1d10,0 0 24px rgba(0,0,0,.6)}
.home-title h1{font-size:clamp(44px,8vw,86px)}
.welcome{margin:6px 0 0;font-family:var(--display);font-size:clamp(18px,2.6vw,28px);color:#fff4d6;letter-spacing:.03em}
.home-nav{display:flex;flex-direction:column;gap:10px;align-self:start}
.home-nav .money{text-align:center;margin-bottom:2px;text-shadow:0 2px 6px #000}
.navbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;padding:13px 16px;
  background:rgba(14,26,43,.86);border:1px solid #3b5679;border-right:4px solid #3b5679;transition:background .15s,border-color .15s}
.navbtn b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--paper)}
.navbtn small{font-size:12.5px;color:var(--steel)}
.navbtn.on{border-color:var(--signal);background:rgba(29,49,80,.95)}
.navbtn.on b{color:var(--signal)}
button.link{background:none;border:none;color:var(--steel);font-size:13px;text-decoration:underline;align-self:center;margin-top:6px}
button.link:hover{background:none;color:var(--paper)}
.home-panel{min-height:0;overflow-y:auto;align-self:start;max-height:100%;background:rgba(22,38,61,.94);border:2px solid #2c4262;
  border-radius:6px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:panelIn .18s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;text-align:right;padding:10px 12px;background:#0f1d30;border:1px solid #2c4262;border-radius:5px}
.item:hover:not(:disabled){border-color:var(--signal);background:#14263f}
.item.next{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.item .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#22344d;color:var(--signal);font-family:var(--display);font-size:17px}
.item .txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .txt small{color:var(--steel);font-size:12.5px;font-weight:400;line-height:1.4}
.pill.ok{background:#24452c;color:#bfe6c6}
.diff{display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:rgba(14,26,43,.86);border:1px solid #3b5679;border-radius:4px}
.diff .lbl{font-size:12.5px;color:var(--steel)}
.diff .seg{display:flex;gap:4px}
.diff .seg button{flex:1;padding:6px 4px;font-size:14px}
.diff .seg button.on{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
.diff small{font-size:11.5px;color:var(--steel);line-height:1.35}
@media (max-width:760px){ .home-nav .diff{grid-column:1/-1} }
.stars-res{margin:4px 0 14px;padding:10px 14px;background:#0f1d30;border:1px solid #2c4262;border-radius:5px}
.stars-res .big{font-size:30px;color:var(--signal);letter-spacing:4px;line-height:1.1}
.stars-res ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px;color:var(--steel);line-height:1.7}
.stars-res li.ok{color:var(--paper)} .stars-res li.ok::first-letter{color:var(--signal)}
.stars-goals{list-style:none;padding-right:0} .stars-goals li{color:var(--steel)}
.item .stars{flex:none;color:var(--signal);font-size:14px;letter-spacing:1px}
.skinprev{width:100%;height:auto;aspect-ratio:18/7;background:linear-gradient(#9cc4e4,#d8e8f2);border-radius:4px}
.board:has(.goals){width:min(700px,100%)}
.goals{margin:8px 0 6px;padding-right:22px;line-height:1.7;font-size:15px}
.goals li::marker{color:var(--signal);font-family:var(--display)}
.tip{margin:10px 0 0;padding:9px 12px;border-right:3px solid var(--signal);background:#0f1d30;font-size:14px;color:var(--paper);border-radius:3px}
.tip b{color:var(--signal)}
@media (max-width:760px){
  .home{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);overflow-y:auto;background:rgba(8,14,24,.6)}
  .home-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .home-nav .money,.home-nav .link{grid-column:1/-1}
  .navbtn{padding:10px 12px} .navbtn b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important} #title .press{animation:none}}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="touch">
  <div class="pad">
    <button data-k="KeyZ" aria-label="גלגול חבית">↻</button><button data-k="ArrowUp" aria-label="למעלה">▲</button><span></span>
    <button data-k="ArrowLeft" aria-label="שמאלה">◀</button><button data-k="ArrowDown" aria-label="למטה">▼</button><button data-k="ArrowRight" aria-label="ימינה">▶</button>
  </div>
  <div class="pad">
    <button data-k="KeyW" aria-label="מצערת">⇧</button><button data-k="KeyX" aria-label="חימוש">💣</button><button data-k="KeyC" aria-label="פקודה">⚑</button>
    <button data-k="KeyS" aria-label="האט">⇩</button><button data-k="Space" aria-label="ירי">✸</button><button data-k="Escape" aria-label="עצור">II</button>
  </div>
</div>
<div id="ui"></div>
<div id="title" role="button" tabindex="0" aria-label="כנפי הרעם – לחץ על מקש כלשהו להתחלה">
  <div class="blur"></div>
  <img src="img/title.jpg" alt="כנפי הרעם: מטוס הלקט מעל נושאת מטוסים בקרב מול מטוסי זירו">
  <div class="press">לחץ על מקש כלשהו להתחלה</div>
  <div class="credits"><span id="ver"></span><span>נוצר על ידי <b>YSL LABS</b></span></div>
  <button id="musicBtn" type="button">♪ הפעל מוזיקה</button>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/maneuvers.js"></script>
<script src="js/aircraft.js"></script>
<script src="js/plane3d.js"></script>
<script src="js/render.js"></script>
<script src="js/carrier.js"></script>
<script src="js/ships.js"></script>
<script src="js/structures.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/defense.js"></script>
<script src="js/ground.js"></script>
<script src="js/ground-draw.js"></script>
<script src="js/specials.js"></script>
<script src="js/extras.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
